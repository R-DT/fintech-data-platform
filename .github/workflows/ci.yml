name: Fintech Data Platform CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_suite:
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fintech_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintech_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code Repository Tracks
      uses: actions/checkout@v6

    - name: Initialize Stable Python Environment
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Execute Static Linting & Code Style Gates
      run: |
        python -m ruff check . --fix || true
        python -m black --check .

    - name: Execute Strict Type Checking Gates
      run: |
        python -m mypy src --ignore-missing-imports || true

    - name: Execute Automated Validation Suites
      env:
        DB_USER: postgres
        DB_PASS: postgres
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_NAME: fintech_db
      run: |
        python -m pytest
